spring.application.name=synk

# PostgreSQL (from compose.yaml)
spring.datasource.url=jdbc:postgresql://localhost:5432/synk
spring.datasource.username=synk
spring.datasource.password=synk

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Session (stored in PostgreSQL by Spring Session, so any pod can serve any request)
spring.session.timeout=30d
# The tables are created by Liquibase, not by Spring Session
spring.session.jdbc.initialize-schema=never
server.servlet.session.cookie.same-site=lax
# Keep the cookie when the browser is closed, for as long as the session lives
server.servlet.session.cookie.max-age=30d
