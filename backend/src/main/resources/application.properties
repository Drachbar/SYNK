spring.application.name=synk

# PostgreSQL. Defaults for local development (compose.yaml); in production these are
# overridden by SPRING_DATASOURCE_URL/USERNAME/PASSWORD in /etc/synk/synk.env (docs/drift.md).
spring.datasource.url=jdbc:postgresql://localhost:5432/synk
spring.datasource.username=synk
spring.datasource.password=synk

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Session (stored in PostgreSQL by Spring Session, so any pod can serve any request)
spring.session.timeout=30d
# The tables are created by Liquibase, not by Spring Session
spring.session.jdbc.initialize-schema=never
server.servlet.session.cookie.same-site=lax
# Keep the cookie when the browser is closed, for as long as the session lives
server.servlet.session.cookie.max-age=30d

# Behind the nginx proxy: trust X-Forwarded-Proto/For so the app knows the request was HTTPS
# (cookies become Secure) and sees the client's address. See docs/drift.md.
server.forward-headers-strategy=native
