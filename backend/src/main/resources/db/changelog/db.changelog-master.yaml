databaseChangeLog:
  - changeSet:
      id: 001
      author: Mattias Andersson
      changes:
        - createTable:
            tableName: app_user
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false

  - changeSet:
      id: 002
      author: Mattias Andersson
      changes:
        - createTable:
            tableName: entry
            remarks: Veckoanteckning - en rad per person och vecka
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: author_id
                  type: UUID
                  remarks: Användaren som skrivit anteckningen
                  constraints:
                    nullable: false
                    foreignKeyName: fk_entry_author
                    references: app_user(id)

              - column:
                  name: iso_year
                  type: INT
                  remarks: ISO 8601-veckoår (kan skilja sig från kalenderåret runt nyår)
                  constraints:
                    nullable: false

              - column:
                  name: iso_week
                  type: INT
                  remarks: ISO 8601-veckonummer, 1-53
                  constraints:
                    nullable: false

              - column:
                  name: schema_version
                  type: INT
                  remarks: Version av formatet i content
                  constraints:
                    nullable: false

              - column:
                  name: content
                  type: JSONB
                  remarks: Formulärsvaren, nycklade på stabila fält-id:n
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: entry
            columnNames: author_id, iso_year, iso_week
            constraintName: uq_entry_author_week

        - sql:
            sql: ALTER TABLE entry ADD CONSTRAINT ck_entry_iso_week CHECK (iso_week BETWEEN 1 AND 53)
      rollback:
        - dropTable:
            tableName: entry

  - changeSet:
      id: 003
      author: Mattias Andersson
      changes:
        # Inloggning sker med namnet, så det måste vara unikt.
        - addUniqueConstraint:
            tableName: app_user
            columnNames: name
            constraintName: uq_app_user_name

  - changeSet:
      id: 004
      author: Mattias Andersson
      changes:
        # Spring Sessions tabeller, kopierade från schema-postgresql.sql i spring-session-jdbc.
        - sql:
            sql: |
              CREATE TABLE SPRING_SESSION (
                  PRIMARY_ID CHAR(36) NOT NULL,
                  SESSION_ID CHAR(36) NOT NULL,
                  CREATION_TIME BIGINT NOT NULL,
                  LAST_ACCESS_TIME BIGINT NOT NULL,
                  MAX_INACTIVE_INTERVAL INT NOT NULL,
                  EXPIRY_TIME BIGINT NOT NULL,
                  PRINCIPAL_NAME VARCHAR(100),
                  CONSTRAINT SPRING_SESSION_PK PRIMARY KEY (PRIMARY_ID)
              );

              CREATE UNIQUE INDEX SPRING_SESSION_IX1 ON SPRING_SESSION (SESSION_ID);
              CREATE INDEX SPRING_SESSION_IX2 ON SPRING_SESSION (EXPIRY_TIME);
              CREATE INDEX SPRING_SESSION_IX3 ON SPRING_SESSION (PRINCIPAL_NAME);

              CREATE TABLE SPRING_SESSION_ATTRIBUTES (
                  SESSION_PRIMARY_ID CHAR(36) NOT NULL,
                  ATTRIBUTE_NAME VARCHAR(200) NOT NULL,
                  ATTRIBUTE_BYTES BYTEA NOT NULL,
                  CONSTRAINT SPRING_SESSION_ATTRIBUTES_PK PRIMARY KEY (SESSION_PRIMARY_ID, ATTRIBUTE_NAME),
                  CONSTRAINT SPRING_SESSION_ATTRIBUTES_FK FOREIGN KEY (SESSION_PRIMARY_ID) REFERENCES SPRING_SESSION(PRIMARY_ID) ON DELETE CASCADE
              );
      rollback:
        - sql:
            sql: DROP TABLE SPRING_SESSION_ATTRIBUTES; DROP TABLE SPRING_SESSION;

  - changeSet:
      id: 005
      author: Mattias Andersson
      comment: Veckoanteckningen blir gemensam - en rad per vecka i stället för per person och vecka
      changes:
        - dropUniqueConstraint:
            tableName: entry
            constraintName: uq_entry_author_week
        - dropForeignKeyConstraint:
            baseTableName: entry
            constraintName: fk_entry_author
        - dropColumn:
            tableName: entry
            columnName: author_id

        - addColumn:
            tableName: entry
            columns:
              - column:
                  name: updated_by_id
                  type: UUID
                  remarks: Användaren som senast sparade anteckningen
                  constraints:
                    nullable: false
                    foreignKeyName: fk_entry_updated_by
                    references: app_user(id)
              - column:
                  name: version
                  type: INT
                  defaultValueNumeric: 0
                  remarks: Ökas vid varje sparning, för att upptäcka samtidiga ändringar
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: entry
            columnNames: iso_year, iso_week
            constraintName: uq_entry_week

  - changeSet:
      id: 006
      author: Mattias Andersson
      comment: Användarnamn är inte skiftlägeskänsliga - "Mattias" och "mattias" är samma användare
      changes:
        - dropUniqueConstraint:
            tableName: app_user
            constraintName: uq_app_user_name
        - sql:
            sql: CREATE UNIQUE INDEX uq_app_user_name_lower ON app_user (lower(name))
      rollback:
        - sql:
            sql: DROP INDEX uq_app_user_name_lower
        - addUniqueConstraint:
            tableName: app_user
            columnNames: name
            constraintName: uq_app_user_name

  - changeSet:
      id: 007
      author: Mattias Andersson
      comment: Formulären flyttar från koden till databasen och versioneras
      changes:
        - createTable:
            tableName: form_version
            remarks: En version av veckoformuläret. Ändras aldrig; en ändring blir en ny version.
            columns:
              - column:
                  name: version
                  type: INT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: definition
                  type: JSONB
                  remarks: Avsnitt och fält, se docs/databas.md
                  constraints:
                    nullable: false
              - column:
                  name: created_by_id
                  type: UUID
                  remarks: Vem som skapade versionen. Null för versionerna som följde med appen.
                  constraints:
                    nullable: true
                    foreignKeyName: fk_form_version_created_by
                    references: app_user(id)
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false

        # Version 1 är formuläret som låg i koden (fields.ts). Version 2 bygger på det första synk-mötet.
        - sql:
            sql: |
              INSERT INTO form_version (version, definition) VALUES
              (1, '{"sections": [
                {"title": "Summering", "fields": [{"id": "summary", "type": "textarea", "label": ""}]},
                {"title": "Yrkanden/Yttranden", "fields": [{"id": "statements", "type": "textarea", "label": ""}]},
                {"title": "Nästa vecka", "fields": [{"id": "next_week", "type": "textarea", "label": ""}]},
                {"title": "Käk", "fields": [{"id": "meals", "type": "textarea", "label": ""}]}
              ]}'),
              (2, '{"sections": [
                {"title": "Summering", "fields": [
                  {"id": "week_feeling", "type": "perPerson", "label": "Hur har veckan varit?"},
                  {"id": "highlight", "type": "perPerson", "label": "Veckans höjdpunkt"},
                  {"id": "lowlight", "type": "perPerson", "label": "Veckans bajs"},
                  {"id": "mood", "type": "perPerson", "label": "Hur mår du?"},
                  {"id": "last_plan", "type": "checklist", "label": "Förra veckans plan", "carryFrom": "next_week"}
                ]},
                {"title": "Yrkanden/Yttranden", "fields": [
                  {"id": "motions", "type": "perPerson", "label": ""},
                  {"id": "motions_shared", "type": "textarea", "label": "Gemensamt"}
                ]},
                {"title": "Nästa vecka", "fields": [{"id": "next_week", "type": "checklist", "label": ""}]},
                {"title": "Käk", "fields": [{"id": "menu", "type": "weekdays", "label": ""}]}
              ]}')

        - renameColumn:
            tableName: entry
            oldColumnName: schema_version
            newColumnName: form_version
            remarks: Formulärsversionen som anteckningen sparades med
        - addForeignKeyConstraint:
            baseTableName: entry
            baseColumnNames: form_version
            referencedTableName: form_version
            referencedColumnNames: version
            constraintName: fk_entry_form_version
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: entry
            constraintName: fk_entry_form_version
        - renameColumn:
            tableName: entry
            oldColumnName: form_version
            newColumnName: schema_version
        - dropTable:
            tableName: form_version
