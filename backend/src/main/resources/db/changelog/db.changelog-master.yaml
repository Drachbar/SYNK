databaseChangeLog:
  - changeSet:
      id: 001
      author: Mattias Andersson
      changes:
        - createTable:
            tableName: app_user
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false

  - changeSet:
      id: 002
      author: Mattias Andersson
      changes:
        - createTable:
            tableName: entry
            remarks: Veckoanteckning - en rad per person och vecka
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: author_id
                  type: UUID
                  remarks: Användaren som skrivit anteckningen
                  constraints:
                    nullable: false
                    foreignKeyName: fk_entry_author
                    references: app_user(id)

              - column:
                  name: iso_year
                  type: INT
                  remarks: ISO 8601-veckoår (kan skilja sig från kalenderåret runt nyår)
                  constraints:
                    nullable: false

              - column:
                  name: iso_week
                  type: INT
                  remarks: ISO 8601-veckonummer, 1-53
                  constraints:
                    nullable: false

              - column:
                  name: schema_version
                  type: INT
                  remarks: Version av formatet i content
                  constraints:
                    nullable: false

              - column:
                  name: content
                  type: JSONB
                  remarks: Formulärsvaren, nycklade på stabila fält-id:n
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: entry
            columnNames: author_id, iso_year, iso_week
            constraintName: uq_entry_author_week

        - sql:
            sql: ALTER TABLE entry ADD CONSTRAINT ck_entry_iso_week CHECK (iso_week BETWEEN 1 AND 53)
      rollback:
        - dropTable:
            tableName: entry

  - changeSet:
      id: 003
      author: Mattias Andersson
      changes:
        # Inloggning sker med namnet, så det måste vara unikt.
        - addUniqueConstraint:
            tableName: app_user
            columnNames: name
            constraintName: uq_app_user_name

  - changeSet:
      id: 004
      author: Mattias Andersson
      changes:
        # Spring Sessions tabeller, kopierade från schema-postgresql.sql i spring-session-jdbc.
        - sql:
            sql: |
              CREATE TABLE SPRING_SESSION (
                  PRIMARY_ID CHAR(36) NOT NULL,
                  SESSION_ID CHAR(36) NOT NULL,
                  CREATION_TIME BIGINT NOT NULL,
                  LAST_ACCESS_TIME BIGINT NOT NULL,
                  MAX_INACTIVE_INTERVAL INT NOT NULL,
                  EXPIRY_TIME BIGINT NOT NULL,
                  PRINCIPAL_NAME VARCHAR(100),
                  CONSTRAINT SPRING_SESSION_PK PRIMARY KEY (PRIMARY_ID)
              );

              CREATE UNIQUE INDEX SPRING_SESSION_IX1 ON SPRING_SESSION (SESSION_ID);
              CREATE INDEX SPRING_SESSION_IX2 ON SPRING_SESSION (EXPIRY_TIME);
              CREATE INDEX SPRING_SESSION_IX3 ON SPRING_SESSION (PRINCIPAL_NAME);

              CREATE TABLE SPRING_SESSION_ATTRIBUTES (
                  SESSION_PRIMARY_ID CHAR(36) NOT NULL,
                  ATTRIBUTE_NAME VARCHAR(200) NOT NULL,
                  ATTRIBUTE_BYTES BYTEA NOT NULL,
                  CONSTRAINT SPRING_SESSION_ATTRIBUTES_PK PRIMARY KEY (SESSION_PRIMARY_ID, ATTRIBUTE_NAME),
                  CONSTRAINT SPRING_SESSION_ATTRIBUTES_FK FOREIGN KEY (SESSION_PRIMARY_ID) REFERENCES SPRING_SESSION(PRIMARY_ID) ON DELETE CASCADE
              );
      rollback:
        - sql:
            sql: DROP TABLE SPRING_SESSION_ATTRIBUTES; DROP TABLE SPRING_SESSION;
