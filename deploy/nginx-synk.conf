# Exempel för proxy-VM:en. TLS/Let's Encrypt konfigureras som för era övriga sajter.
# APP_VM = app-VM:ens adress.

# I http-blocket: begränsa inloggningsförsök per IP.
limit_req_zone $binary_remote_addr zone=synk_login:10m rate=10r/m;

server {
    listen 443 ssl;
    http2 on;
    server_name synk.example.se;

    # ssl_certificate ... / ssl_certificate_key ... (Let's Encrypt)

    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/auth/login {
        limit_req zone=synk_login burst=5 nodelay;
        proxy_pass http://APP_VM:8080;
    }

    location / {
        proxy_pass http://APP_VM:8080;
    }
}
